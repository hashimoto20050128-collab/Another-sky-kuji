<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Another Sky ｜ 抽選くじ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --night:#0B1026;--night-2:#11183a;--panel:#171f47;--panel-2:#1e2860;
    --line:rgba(140,160,230,.16);--aurora-a:#5EE6C8;--aurora-b:#A78BFA;
    --gold:#FFCF6B;--gold-deep:#F2A93B;--coral:#FF7E86;
    --ink:#EDF1FF;--muted:#8E9AD0;--ok:#67E8B5;--bad:#FF8FA0;--r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
    background:radial-gradient(1200px 700px at 15% -10%,rgba(94,230,200,.14),transparent 60%),radial-gradient(1000px 800px at 100% 0%,rgba(167,139,250,.18),transparent 55%),linear-gradient(180deg,#0a0f24 0%,#0B1026 45%,#0a0e22 100%);min-height:100vh;overflow-x:hidden}
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .display{font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 40px}

  header.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{font-family:"Zen Maru Gothic";font-weight:900;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:9px;line-height:1}
  .logo .moon{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0%,var(--gold) 45%,var(--gold-deep) 100%);box-shadow:0 0 18px rgba(255,207,107,.55);flex:none}
  .logo small{display:block;font-family:"Zen Kaku Gothic New";font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.18em;margin-top:3px}
  .spacer{flex:1}
  .pill{font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:5px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .pill.cloud{color:var(--aurora-a);border-color:rgba(94,230,200,.4)}
  .pill.cloud .dot{background:var(--aurora-a);box-shadow:0 0 8px var(--aurora-a)}

  .tabs{display:flex;gap:6px;background:rgba(23,31,71,.6);border:1px solid var(--line);padding:5px;border-radius:14px;backdrop-filter:blur(6px)}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:.18s}
  .tabs button.active{background:linear-gradient(135deg,var(--aurora-b),var(--aurora-a));color:#0a0f24;box-shadow:0 6px 18px rgba(94,230,200,.25)}

  .card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:16px;box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
  .view{display:none}.view.on{display:block;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h2.sec{font-family:"Zen Maru Gothic";font-size:16px;margin:0 0 4px;letter-spacing:.02em}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 16px}

  .redeem-hero{text-align:center;padding:6px 0 4px}
  .kicker{color:var(--aurora-a);font-weight:700;font-size:12px;letter-spacing:.3em;margin-bottom:8px}
  .big-title{font-family:"Zen Maru Gothic";font-weight:900;font-size:26px;line-height:1.3;margin:0 0 4px}
  .code-input{width:100%;text-align:center;font-family:"Zen Maru Gothic";font-weight:900;font-size:40px;letter-spacing:.22em;padding:18px 10px;margin-top:16px;background:rgba(11,16,38,.6);border:2px solid var(--line);border-radius:14px;color:var(--ink);text-transform:uppercase;outline:none;transition:.15s}
  .code-input::placeholder{color:#3c477e;letter-spacing:.18em}
  .code-input:focus{border-color:var(--aurora-a);box-shadow:0 0 0 4px rgba(94,230,200,.14)}
  .btn{border:0;font-family:inherit;font-weight:800;font-size:16px;padding:16px;border-radius:14px;cursor:pointer;width:100%;color:#0a0f24;background:linear-gradient(135deg,var(--gold),var(--gold-deep));box-shadow:0 12px 30px -10px rgba(242,169,59,.6);transition:transform .1s,filter .15s}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn:disabled{filter:grayscale(.5) opacity(.6);cursor:default}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;font-weight:700;font-size:14px}
  .btn.slim{padding:12px}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .row .btn{margin:0;flex:1;min-width:130px}

  #cam-box{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:none}
  #reader{width:100%}
  .cam-msg{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
  .feedback{margin-top:14px;text-align:center;font-weight:700;font-size:14px;min-height:20px}
  .feedback.err{color:var(--bad)}

  #stage{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:radial-gradient(900px 900px at 50% 40%,rgba(30,40,96,.7),rgba(8,12,30,.94));backdrop-filter:blur(3px)}
  #stage.on{display:flex}
  #confetti{position:absolute;inset:0;pointer-events:none}
  .stage-inner{position:relative;text-align:center;padding:24px;width:100%;max-width:520px}
  .capsule{width:150px;height:150px;margin:0 auto;position:relative}
  .capsule .orb{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--aurora-a),var(--aurora-b),var(--gold),var(--coral),var(--aurora-a));filter:blur(2px);box-shadow:0 0 60px rgba(167,139,250,.6)}
  .capsule .core{position:absolute;inset:16px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#fff,#cfe4ff 30%,#6d7cc0 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
  .capsule .core img{width:100%;height:100%;object-fit:cover;display:block}
  .shake .orb{animation:spin 1.1s linear infinite}.shake{animation:jiggle .28s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes jiggle{0%,100%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg)}}
  .suspense{color:var(--muted);font-weight:700;letter-spacing:.2em;margin-top:22px;font-size:14px}
  .result{display:none}.result.on{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .result .badge{font-family:"Zen Maru Gothic";font-weight:700;font-size:15px;letter-spacing:.24em;margin-bottom:6px}
  .result .amount{font-family:"Zen Maru Gothic";font-weight:900;font-size:74px;line-height:1;background:linear-gradient(180deg,#fff5d6,var(--gold) 40%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 40px rgba(242,169,59,.35)}
  .result .yen{font-size:26px}
  .result .sub{color:var(--ink);font-weight:700;margin-top:10px;font-size:16px}
  .result.miss .amount{background:linear-gradient(180deg,#dfe6ff,#93a0d8);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:44px}
  .result.free .amount{font-size:52px}
  .result .again{margin-top:26px}

  .field{margin-bottom:14px}
  label.lab{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
  input[type=number]{width:100%;padding:12px 14px;background:rgba(11,16,38,.55);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-family:inherit;font-size:16px;outline:none}
  input[type=number]:focus{border-color:var(--aurora-b)}
  input[type=email],input[type=password]{width:100%;padding:13px 14px;background:rgba(11,16,38,.55);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-family:inherit;font-size:16px;outline:none;margin-bottom:10px}
  input[type=email]:focus,input[type=password]:focus{border-color:var(--aurora-a)}
  #login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:radial-gradient(900px 700px at 20% 0%,rgba(94,230,200,.12),transparent 60%),linear-gradient(180deg,#0a0f24,#0b1026)}
  #login.on{display:flex}
  .login-card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:18px;padding:26px 22px;max-width:340px;width:100%;box-shadow:0 30px 70px -20px #000;text-align:center}
  .login-card .lmoon{width:40px;height:40px;border-radius:50%;margin:0 auto 12px;background:radial-gradient(circle at 32% 30%,#fff 0%,var(--gold) 45%,var(--gold-deep) 100%);box-shadow:0 0 22px rgba(255,207,107,.55)}
  .login-card h3{font-family:"Zen Maru Gothic";font-weight:900;font-size:18px;margin:0 0 4px}
  .login-card p.sub{color:var(--muted);font-size:12px;margin:0 0 18px}
  .login-card .err{color:var(--bad);font-size:12.5px;font-weight:700;min-height:18px;margin-top:6px}
  select{width:100%;padding:11px 12px;background:rgba(11,16,38,.55);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-family:inherit;font-size:14px;outline:none}
  .prize-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .prize-cell{background:rgba(11,16,38,.4);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .prize-cell.free{border-color:rgba(255,207,107,.5);background:rgba(255,207,107,.08)}
  .prize-cell .pl{font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;margin-bottom:6px}
  .prize-cell.free .pl{color:var(--gold)}
  .prize-cell input{padding:9px 10px;font-size:15px}
  .tally{display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding:12px 14px;background:rgba(11,16,38,.45);border:1px dashed var(--line);border-radius:12px;font-size:13px}
  .tally b{font-family:"Zen Maru Gothic";font-size:18px}.tally .miss-n{color:var(--aurora-a)}
  .warn{color:var(--bad);font-size:12.5px;margin-top:6px;min-height:16px}
  .cklab{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:12px 2px 4px;cursor:pointer;user-select:none}
  .cklab input{width:auto;accent-color:var(--aurora-b)}

  /* ===== Tickets (長方形・切りやすく) ===== */
  #tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:16px}
  .ticket{background:#fff;color:#12183a;border-radius:0;padding:0;text-align:center;position:relative;overflow:hidden;border:1px dashed #b9c0da;margin:-0.5px;height:375px;display:flex;flex-direction:column}
  .ticket.empty{visibility:hidden}
  .ticket .band{display:block;width:100%;height:7px;flex:none}
  .ticket .inner{padding:9px 10px 8px;flex:1;display:flex;flex-direction:column}
  .ticket .promo{font-family:"Zen Maru Gothic";font-weight:900;font-size:10px;line-height:1.35;color:#c2410c;margin:6px 2px 4px}
  .ticket .promo b{color:#b91c1c;font-size:11px}
  .ticket .tt{font-family:"Zen Maru Gothic";font-weight:900;font-size:9.5px;margin:2px 0 6px;letter-spacing:.04em;color:#3a4790}
  .ticket .qrbox{display:flex;justify-content:center;margin:0 auto 6px}
  .ticket .qrbox img,.ticket .qrbox canvas{width:80px!important;height:80px!important}
  .ticket .tcode{font-family:"Zen Maru Gothic";font-weight:900;font-size:20px;letter-spacing:.16em;color:#12183a}
  .ticket .ccode{font-size:10px;color:#8b93b8;letter-spacing:.06em;margin-top:3px}
  .ticket .ccode b{color:#12183a;font-family:"Zen Maru Gothic";letter-spacing:.14em}
  .ticket .seqlabel{font-size:11px;color:#3a4790;font-weight:700;margin-top:7px}
  .ticket .seqno{font-family:"Zen Maru Gothic";font-weight:900;font-size:26px;color:#12183a;letter-spacing:.04em;line-height:1.05}
  .ticket .qrcap{font-size:8.5px;line-height:1.35;color:#5a6294;margin:5px 3px 2px;font-weight:700}
  .ticket .stub{border-top:1px dashed #9aa1c4;margin-top:auto;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .ticket .stub .scis{position:absolute;left:4px;top:-8px;font-size:11px;color:#9aa1c4}
  .ticket .stub-row{display:flex;align-items:center;justify-content:center;gap:8px}
  .ticket .stub-qr{flex:none;display:flex}
  .ticket .stub-qr img,.ticket .stub-qr canvas{width:52px!important;height:52px!important}
  .ticket .stub-info{text-align:left;color:#3a4790;font-weight:700;line-height:1.3}
  .ticket .stub-info .stub-no{font-size:10px}
  .ticket .stub-info .stub-no b{font-family:"Zen Maru Gothic";font-size:15px;letter-spacing:.1em}
  .ticket .stub-cap2{font-size:8px;color:#5a6294;font-weight:700;line-height:1.35;text-align:center}
  /* back = 注文票 */
  .ticket.back .inner{padding:30px 14px 16px;text-align:left}
  .ticket.back .bt{font-family:"Zen Maru Gothic";font-weight:900;font-size:12px;color:#3a4790;text-align:center;margin-bottom:22px;letter-spacing:.04em}
  .ticket.back .orow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin:0 0 34px}
  .ticket.back .box{display:inline-block;flex:none;width:34px;height:24px;border:1px solid #7c86ad}
  .ticket.back .line{flex:1;border-bottom:1px solid #7c86ad;height:24px}
  .ticket.back .bno{position:absolute;top:6px;right:8px;font-size:9px;color:#9aa1c4;font-weight:700;font-family:"Zen Maru Gothic"}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
  .stat{background:rgba(11,16,38,.45);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .stat .n{font-family:"Zen Maru Gothic";font-weight:900;font-size:28px}
  .stat .l{color:var(--muted);font-size:11px;margin-top:2px}
  table.brk{width:100%;border-collapse:collapse;font-size:13px}
  table.brk th,table.brk td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  table.brk th{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.06em}
  table.brk td.num{text-align:right;font-family:"Zen Maru Gothic";font-weight:700}
  .danger{color:var(--bad);border-color:rgba(255,143,160,.4)}
  .empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13.5px;line-height:1.7}
  .modehead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:14px;padding:10px 12px;background:rgba(11,16,38,.4);border:1px solid var(--line);border-radius:11px}
  .axis-tabs{display:flex;gap:6px;margin-bottom:14px}
  .axis-tabs button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:12.5px;padding:9px;border-radius:10px;cursor:pointer}
  .axis-tabs button.active{background:linear-gradient(135deg,var(--aurora-b),var(--aurora-a));color:#0a0f24;border-color:transparent}

  #modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(6,9,22,.72);backdrop-filter:blur(2px);padding:20px}
  #modal.on{display:flex}
  .modal-card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 30px 70px -20px #000}
  .modal-card p{margin:0 0 18px;font-size:14px;line-height:1.7}
  .modal-btns{display:flex;gap:10px}.modal-btns .btn{margin:0}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:90;background:#1b2350;border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    #tickets{grid-template-columns:repeat(2,1fr)}
    .stat-grid{grid-template-columns:1fr 1fr 1fr}
    .big-title{font-size:22px}.code-input{font-size:34px}
    header.top{flex-wrap:wrap}
  }
  @media print{
    @page{margin:8mm}
    body{background:#fff}
    #stars,header.top,.tabs,.no-print{display:none!important}
    .wrap{max-width:none;padding:0}
    .card{box-shadow:none;border:0;padding:0;background:#fff;margin:0}
    #tickets{grid-template-columns:repeat(3,1fr);gap:0}
    .ticket{border:1px dashed #8a92b5;break-inside:avoid;page-break-inside:avoid}
    /* SVGは前景として印刷されるので「背景グラフィック」設定に依存しません */
  }
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <header class="top">
    <div class="logo"><span class="moon"></span><div>Another Sky<small>KUJI ｜ 大学祭 抽選くじ</small></div></div>
    <div class="spacer"></div>
    <div class="pill" id="status-pill"><span class="dot"></span><span id="status-text">…</span></div>
  </header>

  <div class="tabs">
    <button data-tab="redeem" class="active">抽選する</button>
    <button data-tab="make">券をつくる</button>
    <button data-tab="admin">集計・管理</button>
  </div>

  <!-- REDEEM -->
  <section class="view on card" id="v-redeem">
    <div class="redeem-hero">
      <div class="kicker">SCAN &amp; WIN</div>
      <p class="big-title display">QRコードを<br>かざしてね</p>
    </div>
    <div id="cam-box"><div id="reader"></div></div>
    <div class="cam-msg" id="cam-msg"></div>
    <div class="feedback" id="fb"></div>
    <div class="row">
      <button class="btn ghost slim" id="cam-btn">カメラを開始</button>
      <button class="btn ghost slim" id="manual-btn">コードを手入力</button>
    </div>
    <label class="cklab" style="justify-content:center;margin-top:6px"><input type="checkbox" id="sound-ck" checked>読み取り時に音を鳴らす</label>
    <div id="manual-area" style="display:none;margin-top:14px">
      <input id="code" class="code-input" maxlength="4" placeholder="＊＊＊＊" autocomplete="off" inputmode="text">
      <button class="btn" id="draw-btn" style="margin-top:12px">抽選する</button>
    </div>
  </section>

  <!-- MAKE -->
  <section class="view card" id="v-make">
    <h2 class="sec display">くじ券を作成（追加）</h2>
    <p class="hint">枚数と各当たりの本数を決めて作成します。<b style="color:var(--ink)">既存の券はそのまま残し、追加で発行</b>します（過去の使用記録も維持）。当日ごとに作成日で集計できます。</p>
    <div class="field"><label class="lab">今回つくる枚数</label><input type="number" id="total" min="1" max="600" value="100"></div>
    <label class="lab">当たりの本数</label>
    <div class="prize-grid" id="prize-grid"></div>
    <div class="tally"><span>はずれ：<span class="miss-n" id="miss-n">—</span> 本</span><span>当たり合計：<b id="hit-n">0</b> 本</span></div>
    <div class="warn" id="make-warn"></div>
    <button class="btn" id="gen-btn">この内容で券を作成する</button>

    <div id="print-area" style="display:none">
      <div class="row" style="margin-top:16px">
        <button class="btn ghost slim" id="print-front">表（くじ）を印刷</button>
        <button class="btn ghost slim" id="print-back">裏（注文票）を印刷</button>
      </div>
      <label class="cklab"><input type="checkbox" id="mirror-ck" checked>裏面の左右を反転（両面印刷でズレる場合はここを切り替え）</label>
      <p class="hint" style="margin-top:6px">※まず1枚だけ試し刷りを。用紙を長辺で裏返して裏面を印刷 → 番号が合うか確認してください。合わなければ上のチェックを切り替えます。</p>
    </div>
    <div id="tickets"></div>

<script>
/* ============================================================
   Another Sky ｜ 抽選くじ
   ------------------------------------------------------------
   ▼ クラウド運用の設定方法（どちらか一方でOK）
     方法A：下の各行の「//」を外して値を入れる（変数名は FIREBASE_CONFIG のまま）
     方法B：Firebaseコンソールのスニペット
            （const firebaseConfig = { ... };）を丸ごとコピーして、
            下の const FIREBASE_CONFIG の“すぐ上”に貼り付ける。
            ※このアプリは FIREBASE_CONFIG / firebaseConfig のどちらの名前でも動きます。
     設定しなければ、ログイン不要の「この端末に保存」モードで動きます。
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBhcZR0uO8384IGtkOE_8mRx7MatiJX4sQ",
  authDomain: "another-sky-kuji-9606f.firebaseapp.com",
  projectId: "another-sky-kuji-9606f",
  storageBucket: "another-sky-kuji-9606f.firebasestorage.app",
  messagingSenderId: "372480688726",
  appId: "1:372480688726:web:6b77d1983691056cf471f7"
};

/* お客さんがスマホでQRを読むと開く「店舗・くじ情報ページ」のURL。
   ここを設定すると、QRは INFO_URL + くじコード になり、お客さんのスマホでも開けます。
   （情報ページは別途ご用意ください。例: "https://your-site.example/info"）
   空のままなら、QRは店員端末での抽選専用（お客さんが読んでも情報ページは開きません）。*/
const INFO_URL = "https://canva.link/another-sky";

const KEY="another_sky_kuji_v2";
const CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const COLLECTION="as_kuji_tickets";
const FREE=99999;                              // 無料 の内部値
const WIN=[{v:FREE,label:"1品無料"},{v:200,label:"200円引き"},{v:100,label:"100円引き"},{v:50,label:"50円引き"}];
const PRINT_COLS=3;

let Backend,CLOUD=false,db,col,ordersCol,currentTab="redeem",busy=false,lastTickets=null,adminDay="ALL",adminAxis="created";

function prizeLabel(v){ return v===FREE?"1品無料":(v===0?"はずれ":v+"円引き"); }
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dateStr(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function usedDayOf(r){ return r.usedDay || (r.usedAt?dateStr(r.usedAt):null); }

/* device-local storage */
const Store={
  async get(k){ if(window.storage){try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){}} try{return localStorage.getItem(k);}catch(e){return null;} },
  async set(k,v){ if(window.storage){try{await window.storage.set(k,v);return true;}catch(e){}} try{localStorage.setItem(k,v);return true;}catch(e){return false;} }
};

/* modal / toast */
function uiConfirm(msg){return new Promise(res=>{document.getElementById("modal-msg").textContent=msg;const m=document.getElementById("modal");m.classList.add("on");const y=document.getElementById("modal-yes"),n=document.getElementById("modal-no");const done=v=>{m.classList.remove("on");y.onclick=null;n.onclick=null;res(v);};y.onclick=()=>done(true);n.onclick=()=>done(false);});}
let toastT;function uiToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2800);}

/* helpers */
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;}
function randCode(){let s="";for(let i=0;i<4;i++)s+=CHARS[Math.floor(Math.random()*CHARS.length)];return s;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== 効果音（Web Audio・ファイル不要／オフライン可） ===== */
let muted=false,audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function primeAudio(){ const c=ensureAudio(); if(c&&c.state==="suspended") c.resume(); }
document.addEventListener("pointerdown",primeAudio);
document.addEventListener("keydown",primeAudio);
function beep(freqs,dur,type,gain){
  const c=ensureAudio(); if(!c)return;
  if(c.state==="suspended")c.resume();
  let t=c.currentTime;
  freqs.forEach(f=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(gain||0.18,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination);
    o.start(t);o.stop(t+dur+0.02);
    t+=dur;
  });
}
function soundSuccess(){ if(muted)return; beep([988,1319],0.10,"sine",0.2); }   // ピロッ（成功）
function soundError(){ if(muted)return; beep([311,247],0.16,"square",0.12); }   // ブッ（無効・使用済み）

/* ===== Backends ===== */
const state={tickets:{}};
const LocalBackend={
  async init(){const raw=await Store.get(KEY);state.tickets=raw?(JSON.parse(raw).tickets||{}):{};},
  async persist(){await Store.set(KEY,JSON.stringify({tickets:state.tickets}));},
  async existingCodes(){return new Set(Object.keys(state.tickets));},
  async append(t){Object.assign(state.tickets,t);await this.persist();},
  async redeem(code){
    if(!Object.keys(state.tickets).length)return{status:"nodata"};
    const d=state.tickets[code];
    if(!d)return{status:"notfound"};
    if(d.used)return{status:"used",usedAt:d.usedAt};
    d.used=true;d.usedAt=Date.now();d.usedDay=todayStr();await this.persist();
    return{status:"ok",prize:d.prize,seq:d.seq};
  },

  async init(){},
  async existingCodes(){const s=await col.get();return new Set(s.docs.map(d=>d.id));},
  async append(t){const codes=Object.keys(t);for(const part of chunk(codes,450)){const b=db.batch();part.forEach(c=>b.set(col.doc(c),t[c]));await b.commit();}},
  async redeem(code){const ref=col.doc(code);return await db.runTransaction(async tx=>{const s=await tx.get(ref);if(!s.exists)return{status:"notfound"};const d=s.data();if(d.used)return{status:"used",usedAt:d.usedAt};tx.update(ref,{used:true,usedAt:Date.now(),usedDay:todayStr()});return{status:"ok",prize:d.prize,seq:d.seq};});},
  async all(){const s=await col.get();return s.docs.map(d=>({code:d.id,...d.data()}));},

/* ===== Ticket rendering ===== */
function qrText(code,seq){ return INFO_URL ? (INFO_URL+(INFO_URL.includes("?")?"&":"?")+"c="+code+(seq?("&n="+seq):"")) : ("ASQR:"+code); }
function parseCode(txt){
  txt=(txt||"").trim();
  const m=txt.match(/[?&]c=([A-Za-z0-9]{4})/); if(m) return m[1].toUpperCase();
  if(/https?:\/\//i.test(txt)) return "";   // c=の無いURLはコード無し扱い（.html等の誤検出防止）
  txt=txt.replace(/^ASQR:/i,"");
  const m2=txt.match(/([A-Za-z0-9]{4})\s*$/);
  return (m2?m2[1]:txt).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
}
function gradSvg(id){
  return `<svg class="band" viewBox="0 0 100 7" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EE6C8"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FFCF6B"/></linearGradient></defs><rect width="100" height="7" fill="url(#${id})"/></svg>`;
}
function seqStr(seq){return "No."+String(seq).padStart(3,"0");}
function frontCard(code,seq){
  return `<div class="ticket front">${gradSvg("g_"+code)}<div class="inner">
    <div class="promo">最大200円引き！運が良ければタダ！？<b>運試しくじ！</b></div>
    <div class="tt">Another Sky ｜ 抽選くじ</div>
    <div class="qrbox" id="qr-${code}"></div>
    <div class="qrcap">▲QRコードを自分のスマホで読み込んで店舗・くじ情報をチェック！</div>
    <div class="ccode">コード <b>${code}</b></div>
    <div class="seqlabel">整理番号</div>
    <div class="seqno">${seqStr(seq)}</div>
    <div class="stub"><span class="scis">✂</span><div class="stub-row"><div class="stub-qr" id="sqr-${code}"></div><div class="stub-info"><div class="stub-no">整理番号 <b>${String(seq).padStart(3,"0")}</b></div></div></div><div class="stub-cap2">▲待ち人数の確認や受け取り可能時に通知を受け取れます</div></div>
  </div></div>`;
}
function backCard(code,seq){
  return `<div class="ticket back"><div class="inner">
    <div class="bno">${seqStr(seq)}</div>
    <div class="bt">ご注文票</div>
    <div class="orow">焼きそば<span class="line"></span>個</div>
    <div class="orow">はしまき<span class="line"></span>個</div>
  </div></div>`;
}
function emptyCard(){return `<div class="ticket empty"></div>`;}

function renderSide(side){
  if(!lastTickets)return;
  const box=document.getElementById("tickets");box.innerHTML="";
  let codes=Object.keys(lastTickets);
  if(side==="back" && document.getElementById("mirror-ck").checked){
    const out=[];
    for(let i=0;i<codes.length;i+=PRINT_COLS){
      const rowArr=codes.slice(i,i+PRINT_COLS);
      while(rowArr.length<PRINT_COLS)rowArr.push(null);
      rowArr.reverse();out.push(...rowArr);
    }
    codes=out;
  }
  box.innerHTML=codes.map(c=>c===null?emptyCard():(side==="front"?frontCard(c,lastTickets[c].seq):backCard(c,lastTickets[c].seq))).join("");
  if(side==="front"){
    Object.keys(lastTickets).forEach(code=>{
      var _t=qrText(code,lastTickets[code].seq);
      try{new QRCode(document.getElementById("qr-"+code),{text:_t,width:80,height:80,colorDark:"#12183a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}catch(e){}

    });
  }
}

async function processCode(code){
  fb("");

  const btn=document.getElementById("draw-btn");
  busy=true; if(btn){btn.disabled=true;btn.textContent="確認中…";}

  busy=false; if(btn){btn.disabled=false;btn.textContent="抽選する";}
  if(r.status==="nodata"){soundError();fb("券データがありません。先に「券をつくる」で作成してください。",true);setTimeout(()=>scanLock=false,1500);return;}
  if(r.status==="notfound"){soundError();fb("このコードは無効です。券をお確かめください。",true);setTimeout(()=>scanLock=false,1500);return;}
  if(r.status==="used"){soundError();const w=r.usedAt?new Date(r.usedAt).toLocaleString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"";fb("この券は使用済みです"+(w?"（"+w+"）":"")+"。",true);setTimeout(()=>scanLock=false,1800);return;}
  soundSuccess();
  codeInput.value="";
  ensureOrder(code, r.seq);        // 呼び出し一覧へ自動追加
  showReveal(r.prize);            // scanLock はリザルトを閉じたら解除

/* 抽選で読み取った券を、呼び出し管理の一覧（as_orders）へ自動登録（クラウド時のみ） */
async function ensureOrder(code,seq){
  if(!CLOUD || !ordersCol) return;

    const ref=ordersCol.doc(code);
    const snap=await ref.get();
    if(!snap.exists){ await ref.set({code,seq:seq||0,status:"waiting",registeredAt:Date.now()}); }
    else if(seq && !snap.data().seq){ await ref.update({seq}); }   // 整理番号が未設定の注文に補完
  }catch(e){}
}

const cc=document.getElementById("confetti"),cx=cc.getContext("2d");
function sizeCanvas(){cc.width=innerWidth;cc.height=innerHeight;}addEventListener("resize",sizeCanvas);sizeCanvas();
let parts=[],confRunning=false;
function burst(){const cols=["#FFCF6B","#F2A93B","#5EE6C8","#A78BFA","#FF7E86","#ffffff"];for(let i=0;i<160;i++)parts.push({x:innerWidth/2,y:innerHeight*0.42,vx:(Math.random()-.5)*11,vy:Math.random()*-13-4,g:0.28+Math.random()*0.12,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*6.28,vr:(Math.random()-.5)*0.3,life:0});if(!confRunning)runConfetti();}
function runConfetti(){confRunning=true;(function frame(){cx.clearRect(0,0,cc.width,cc.height);let alive=0;parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;if(p.y<cc.height+40)alive++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,1-p.life/150);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.5);cx.restore();});if(alive>0)requestAnimationFrame(frame);else{cx.clearRect(0,0,cc.width,cc.height);parts=[];confRunning=false;}})();}

  const pw=document.getElementById("login-pw").value;
  const err=document.getElementById("login-err");err.textContent="";
  if(!email||!pw){err.textContent="メールアドレスとパスワードを入力してください。";return;}
  const btn=document.getElementById("login-btn");btn.disabled=true;btn.textContent="ログイン中…";
  try{await auth.signInWithEmailAndPassword(email,pw);}
  catch(e){err.textContent="ログインに失敗しました。メール／パスワードをご確認ください。";}
  finally{btn.disabled=false;btn.textContent="ログイン";}
}
document.getElementById("login-btn").addEventListener("click",doLogin);
document.getElementById("login-pw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

/* starfield */
(function(){const c=document.getElementById("stars"),x=c.getContext("2d");function rs(){c.width=innerWidth;c.height=innerHeight;}addEventListener("resize",rs);rs();const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6.28,sp:Math.random()*.03+.008}));(function loop(){x.clearRect(0,0,c.width,c.height);stars.forEach(s=>{s.p+=s.sp;const a=(Math.sin(s.p)+1)/2*.8+.1;x.beginPath();x.arc(s.x*c.width,s.y*c.height,s.r,0,6.28);x.fillStyle="rgba(200,220,255,"+a+")";x.fill();});requestAnimationFrame(loop);})();})();

/* boot */
(async function boot(){
  try{ muted=(await Store.get("as_muted"))==="1"; const sc=document.getElementById("sound-ck"); if(sc) sc.checked=!muted; }catch(e){}
  let cfg=null;
  try{ if(typeof FIREBASE_CONFIG!=="undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) cfg=FIREBASE_CONFIG; }catch(e){}
  try{ if(!cfg && typeof firebaseConfig!=="undefined" && firebaseConfig && firebaseConfig.projectId) cfg=firebaseConfig; }catch(e){}
  const configured=cfg && typeof firebase!=="undefined";
  if(configured){
    try{
      firebase.initializeApp(cfg);
      db=firebase.firestore();col=db.collection(COLLECTION);ordersCol=db.collection("as_orders");Backend=CloudBackend;CLOUD=true;auth=firebase.auth();
      document.getElementById("login").classList.add("on"); // 認証確定まで表示
      auth.onAuthStateChanged(user=>{
        if(user){
          document.getElementById("login").classList.remove("on");
          setStatusPill(user.email);
          if(currentTab==="admin")renderAdmin();
          maybeStartCam();
        }else{
          document.getElementById("login").classList.add("on");
          setStatusPill(null);
          stopCam();
        }
      });
    }catch(e){CLOUD=false;}
  }
  if(!CLOUD){Backend=LocalBackend;await LocalBackend.init();setStatusPill();maybeStartCam();}
})();
</script>
